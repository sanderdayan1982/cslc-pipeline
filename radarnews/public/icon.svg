<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0d2822"/>
      <stop offset="55%" stop-color="#081318"/>
      <stop offset="100%" stop-color="#04070a"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="50%" y1="50%" x2="88%" y2="18%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#1f2937" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full-bleed dark terminal background (perfect for iOS, Android, macOS, PWA) -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="18" y="18" width="988" height="988" rx="204" fill="none" stroke="url(#bezel)" stroke-width="6"/>

  <!-- Ambient phosphor glow -->
  <circle cx="512" cy="512" r="420" fill="url(#coreGlow)"/>

  <!-- Outer degree ring & radar range rings -->
  <g fill="none" stroke="#34d399">
    <circle cx="512" cy="512" r="390" stroke-opacity="0.42" stroke-width="7"/>
    <circle cx="512" cy="512" r="356" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="6 12"/>
    <circle cx="512" cy="512" r="280" stroke-opacity="0.28" stroke-width="5"/>
    <circle cx="512" cy="512" r="185" stroke-opacity="0.34" stroke-width="5"/>
    <circle cx="512" cy="512" r="92" stroke-opacity="0.44" stroke-width="5"/>
    <!-- Crosshairs -->
    <path d="M512 104 V920 M104 512 H920" stroke-opacity="0.22" stroke-width="4"/>
    <path d="M236 236 L788 788 M788 236 L236 788" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="10 14"/>
  </g>

  <!-- Radar conical sweep (0 deg to 58 deg) -->
  <path d="M512 512 L512 122 A390 390 0 0 1 842 305 Z" fill="url(#sweep)"/>

  <!-- Active beam line with glow -->
  <line x1="512" y1="512" x2="842" y2="305" stroke="#6ee7b7" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- High-impact macro target blips -->
  <!-- Critical Red Blip (e.g. Rate Decision / CPI) -->
  <circle cx="690" cy="310" r="52" fill="#ef4444" opacity="0.22"/>
  <circle cx="690" cy="310" r="32" fill="none" stroke="#ef4444" stroke-width="5" opacity="0.75"/>
  <circle cx="690" cy="310" r="17" fill="#fca5a5" filter="url(#glow)"/>

  <!-- Amber Blip -->
  <circle cx="595" cy="215" r="36" fill="#f59e0b" opacity="0.22"/>
  <circle cx="595" cy="215" r="14" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Emerald Blip ( Bullish Currency ) -->
  <circle cx="348" cy="642" r="40" fill="#10b981" opacity="0.20"/>
  <circle cx="348" cy="642" r="15" fill="#34d399" filter="url(#glow)"/>

  <!-- Center transmitter hub -->
  <circle cx="512" cy="512" r="46" fill="#061214" stroke="#34d399" stroke-width="8"/>
  <circle cx="512" cy="512" r="20" fill="#6ee7b7" filter="url(#glow)"/>
</svg>
